name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This fixes the Exit code 128 error
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # This fixes the Node.js 20 warning

      - name: Create automated commit
        run: |
          echo "$(date) - Automated keepalive commit" > keepalive.txt
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "Automated keepalive commit to prevent Streamlit hibernation"
          git push
